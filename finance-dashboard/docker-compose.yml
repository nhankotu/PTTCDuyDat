services:
  db:
    image: postgres:16-alpine
    container_name: finra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finra_finance}
      POSTGRES_USER: ${POSTGRES_USER:-finra_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finra_secret_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finra_admin} -d ${POSTGRES_DB:-finra_finance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  minio:
    image: minio/minio:latest
    container_name: finra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_pass_2026}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  minio-init:
    image: minio/mc:latest
    container_name: finra-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minio_secret_pass_2026} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-finra-raw} &&
      echo 'Finra raw bucket is ready';
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finra-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-finra_finance};Username=${POSTGRES_USER:-finra_admin};Password=${POSTGRES_PASSWORD:-finra_secret_pass_2026}
      Storage__Endpoint: minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-minio_secret_pass_2026}
      Storage__Bucket: ${MINIO_BUCKET:-finra-raw}
      Storage__UseSsl: "false"
      Jwt__Secret: ${JWT_SECRET:-Finra_Super_Secret_Key_For_Jwt_Auth_2026_Minimum_32_Chars!}
      Upload__MaxMb: ${MAX_UPLOAD_MB:-50}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    mem_limit: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finra-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    mem_limit: 256m

volumes:
  pgdata:
  miniodata:
